services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm dev:services:up to create local credentials}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm dev:services:up to create local credentials}
      POSTGRES_DB: ${POSTGRES_DB:-pdv}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-pdv}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.4
    command: ["/data"]
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Run pnpm dev:services:up to create local credentials}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Run pnpm dev:services:up to create local credentials}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object-data:/data

volumes:
  postgres-data:
  object-data:
