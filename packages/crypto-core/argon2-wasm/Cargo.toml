[package]
name = "pdv-argon2-wasm-candidate"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
test-vectors = []

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
