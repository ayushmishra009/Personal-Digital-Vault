<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PDV Argon2 WASM candidate compatibility</title>
  </head>
  <body>
    <pre id="result">RUNNING</pre>
    <script type="module">
      const result = document.querySelector("#result");
      const expectedKat =
        "9dfeb910e80bad0311fee20f9c0e2b12c17987b4cac90c2ef54d5b3021c68bfe";
      const expectedPdvTuple =
        "daf16780dcb73e862146297fa17b81b86b480f33c0b67daef0f2c7c809c5797b";
      const expectedPdvP4 =
        "b8a64b68dea6b88ca8c8862be706aac37cbecda0db7bd68b48f8fa2e7feb6f3e";

      function hex(bytes) {
        return Array.from(bytes, (byte) =>
          byte.toString(16).padStart(2, "0"),
        ).join("");
      }

      function allocate(exports, bytes) {
        const pointer = exports.pdv_alloc(bytes.length);
        if (pointer === 0) throw new Error("WASM allocation failed");
        new Uint8Array(exports.memory.buffer, pointer, bytes.length).set(bytes);
        return pointer;
      }

      try {
        const wasmBytes = Uint8Array.from(atob("__PDV_WASM_BASE64__"), (char) =>
          char.charCodeAt(0),
        );
        const { instance } = await WebAssembly.instantiate(wasmBytes);
        const wasm = instance.exports;
        const password = new TextEncoder().encode("password");
        const salt = new TextEncoder().encode("somesalt");
        const passwordPointer = allocate(wasm, password);
        const saltPointer = allocate(wasm, salt);
        const outputPointer = wasm.pdv_alloc(32);
        if (outputPointer === 0)
          throw new Error("WASM output allocation failed");

        const katStatus = wasm.pdv_test_kat(
          passwordPointer,
          password.length,
          saltPointer,
          salt.length,
          outputPointer,
          32,
        );
        if (katStatus !== 0)
          throw new Error(`KAT returned status ${katStatus}`);
        const actualKat = hex(
          new Uint8Array(wasm.memory.buffer, outputPointer, 32),
        );
        if (actualKat !== expectedKat) {
          throw new Error(`KAT mismatch: ${actualKat}`);
        }

        const candidateSalt = new TextEncoder().encode("0123456789abcdef");
        const candidateSaltPointer = allocate(wasm, candidateSalt);
        const candidateTimes = [];
        for (let index = 0; index < 6; index += 1) {
          const startedAt = performance.now();
          const candidateStatus = wasm.pdv_derive_key_p4(
            passwordPointer,
            password.length,
            candidateSaltPointer,
            candidateSalt.length,
            outputPointer,
            32,
          );
          candidateTimes.push(performance.now() - startedAt);
          if (candidateStatus !== 0) {
            throw new Error(`PDV tuple returned status ${candidateStatus}`);
          }
          const actualCandidate = hex(
            new Uint8Array(wasm.memory.buffer, outputPointer, 32),
          );
          if (actualCandidate !== expectedPdvP4) {
            throw new Error(`PDV tuple mismatch: ${actualCandidate}`);
          }
        }
        candidateTimes.sort((left, right) => left - right);

        const legacyStatus = wasm.pdv_derive_key(
          passwordPointer,
          password.length,
          candidateSaltPointer,
          candidateSalt.length,
          outputPointer,
          32,
        );
        if (
          legacyStatus !== 0 ||
          hex(new Uint8Array(wasm.memory.buffer, outputPointer, 32)) !==
            expectedPdvTuple
        ) {
          throw new Error("Legacy p=1 envelope vector failed");
        }

        if (wasm.pdv_derive_key(1, 1, 1, 0, outputPointer, 32) !== 1) {
          throw new Error("Malformed input was not rejected");
        }

        wasm.pdv_free(passwordPointer, password.length);
        wasm.pdv_free(saltPointer, salt.length);
        wasm.pdv_free(candidateSaltPointer, candidateSalt.length);
        wasm.pdv_free(outputPointer, 32);
        result.textContent = `PASS: Chrome low-memory KAT, p=1 compatibility, p=4 vector, and malformed-input checks passed; repetitions=6; median_ms=${candidateTimes[3].toFixed(2)}; min_ms=${candidateTimes[0].toFixed(2)}; max_ms=${candidateTimes[5].toFixed(2)}; wasm_linear_memory_bytes=${wasm.memory.buffer.byteLength}.`;
      } catch (error) {
        result.textContent = `FAIL: ${error instanceof Error ? error.message : String(error)}`;
      }
    </script>
  </body>
</html>
